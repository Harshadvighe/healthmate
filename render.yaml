services:
  - type: web
    name: healthmate-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: healthmate-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://healthmate-app.netlify.app

databases:
  - name: healthmate-db
    databaseName: healthmate
    user: healthmate_user
    plan: free

